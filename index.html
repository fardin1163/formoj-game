<style>
/* 🎨 تم روشن و لطیف */
:root{
  --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
  --panel: #ffffff;
  --panel2: #f1f2f6;
  --ink: #2d3436;
  --muted: #636e72;
  --pink: #ff7675;
  --blue: #74b9ff;
  --green: #55efc4;
  --line: #dfe6e9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-gradient);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:18px 14px 36px}
.brand{text-align:center;padding:12px 0 18px;transition: 0.3s;}
.brand h1{font-size:32px;margin:0;color:var(--pink);letter-spacing:1px;text-shadow: 0 2px 4px rgba(255,118,117,0.2)}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,0.05)}
h2{font-size:17px;margin:0 0 12px;color:var(--pink)}
p{line-height:1.8}.muted{color:var(--muted);font-size:13px}

input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;text-align:center;font-size:18px;letter-spacing:2px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;cursor:pointer;background:var(--pink);color:#fff;min-height:46px;width:100%;margin-top:8px;font-family:inherit;font-size:16px;transition:0.2s}
button:hover{opacity:0.9}
button.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
button.join{background:var(--blue);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

.status{padding:10px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:13px;margin-top:15px;text-align:center;border:1px solid var(--line)}
.status.ok{color:#00b894;border:1px solid #00b894;background:#e8f8f5}

.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;transition:0.3s}
.player.active{border-color:var(--pink);box-shadow:0 0 15px rgba(255,118,117,0.3);background:#fff}
.avatar{width:70px;height:70px;border-radius:50%;border:3px solid var(--pink);margin:0 auto 8px;display:grid;place-items:center;font-size:24px;font-weight:bold;background:#fff;color:var(--pink)}
.player:first-child .avatar{border-color:var(--blue);color:var(--blue)}
.player:last-child .avatar{border-color:var(--pink);color:var(--pink)}

.wheelbox{text-align:center;margin-top:20px}
.wheel{width:min(70vw,250px);height:min(70vw,250px);border-radius:50%;margin:8px auto 14px;background:conic-gradient(var(--pink) 0 50%, var(--blue) 50% 100%);border:8px solid #fff;display:grid;place-items:center;position:relative;transition:transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);box-shadow: 0 10px 25px rgba(0,0,0,0.15)}
.wheel:after{content:"";position:absolute;top:-16px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:0;border-bottom:22px solid #fff;filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2))}
.wheel span{background:#fff;padding:17px;border-radius:50%;font-weight:bold;z-index:10;color:var(--ink);box-shadow: 0 2px 5px rgba(0,0,0,0.1)}

.controls{display:flex; gap:10px;}
#muteBtn{width: 50px; font-size: 20px; padding: 0; background: var(--panel2); border:1px solid var(--line); color: var(--ink);}

.card{min-height:120px;display:grid;place-items:center;text-align:center;background:var(--panel2);border:2px dashed var(--blue);border-radius:15px;padding:18px;font-size:16px;line-height:1.8;margin-top:15px;white-space:pre-wrap;color:var(--ink)}

.chat-container{margin-top:20px;border-top:1px solid var(--line);padding-top:15px;}
.chat-messages{height:180px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;font-size:14px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;line-height:1.4;word-wrap:break-word;}
.msg.me{align-self:flex-start;background:var(--pink);color:#fff;border-bottom-right-radius:2px;}
.msg.opp{align-self:flex-end;background:#fff;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:2px;}
.chat-input-area{display:flex;gap:8px;align-items:center;}
.chat-input-area input[type="text"]{margin:0;text-align:right;letter-spacing:0;font-size:14px;border-radius:12px;flex:1;background:#fff;text-transform:none;}
.chat-input-area button{width:auto;margin:0;padding:0 20px;background:var(--blue);color:#fff;}
</style>

function playSound(type) {
  if (!isSoundOn) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode); gainNode.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === 'spin') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 3);
    gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 3);
    osc.start(now); osc.stop(now + 3);
  } else if (type === 'result') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); 
    gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.start(now); osc.stop(now + 0.5);
  }
}

// تابع برای انتقال به صفحه بازی (شبیه سازی صفحه جدید)
function goToGameScreen() {
  document.getElementById('connectPanel').classList.add('hidden');
  mainHeader.classList.add('hidden'); // مخفی کردن هدر اصلی
  gameSection.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' }); // اسکرول به بالا
}

document.getElementById('hostBtn').onclick = () => {
  myRole = 'host'; currentRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
  goToGameScreen();
  roomInfoBox.classList.remove('hidden'); document.getElementById('roomCodeDisplay').innerText = currentRoom;
  waitStatusText.innerText = 'در انتظار ورود مژگان...'; spinBtn.disabled = true; spinBtn.innerText = 'در انتظار نفر دوم...';
  cardBox.innerText = 'کد اتاق را برای مژگان بفرست.'; connectToSupabase();
};

document.getElementById('joinRoomBtn').onclick = () => {
  const code = document.getElementById('roomCodeIn').value.trim().toUpperCase();
  if (code.length < 4) return alert('لطفاً یک کد معتبر وارد کنید!');
  myRole = 'guest'; currentRoom = code;
  goToGameScreen();
  roomInfoBox.classList.remove('hidden'); document.getElementById('roomCodeDisplay').innerText = currentRoom;
  waitStatusText.innerText = 'در حال اتصال به اتاق...'; spinBtn.disabled = true; spinBtn.innerText = 'در حال اتصال...';
  cardBox.innerText = 'لطفاً صبر کنید...'; connectToSupabase();
};

function connectToSupabase() {
  channel = supabaseClient.channel('room-' + currentRoom, { config: { presence: { key: myRole } } });
  channel
    .on('broadcast', { event: 'game_action' }, (payload) => { handleOpponentAction(payload.payload); })
    .on('broadcast', { event: 'chat_message' }, (payload) => { appendChatMessage(payload.payload.text, 'opp'); })
    .on('presence', { event: 'sync' }, () => {
      const playersCount = Object.keys(channel.presenceState()).length;
      if (playersCount >= 2 && !isConnected) {
          isConnected = true; roomInfoBox.classList.add('hidden'); cardBox.innerText = 'بازی شروع شد!';
          if (myRole === 'host') setTurn(true); else setTurn(false);
      }
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await channel.track({ role: myRole });
    });
}

function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  appendChatMessage(text, 'me');
  if (channel && isConnected) channel.send({ type: 'broadcast', event: 'chat_message', payload: { text: text } });
}
sendChatBtn.onclick = sendChatMessage;
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

function appendChatMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who; div.innerText = text;
  chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
}

function setTurn(isMe) {
  isMyTurn = isMe; spinBtn.disabled = !isMe;
  spinBtn.innerText = isMe ? 'بچرخون!' : 'نوبت حریف است...';
  const p1 = document.getElementById('player1'), p2 = document.getElementById('player2');
  if (myRole === 'host') { p1.classList.toggle('active', isMe); p2.classList.toggle('active', !isMe); }
  else { p2.classList.toggle('active', isMe); p1.classList.toggle('active', !isMe); }
}

spinBtn.onclick = () => {
  if (!isMyTurn) return; 
  setTurn(false); cardBox.innerText = "در حال چرخش...";
  playSound('spin');
  const resultIndex = Math.floor(Math.random() * 2); 
  let cardText = "";
  if (resultIndex === 0) cardText = truthsData[Math.floor(Math.random() * truthsData.length)];
  else cardText = daresData[Math.floor(Math.random() * daresData.length)];
  channel.send({ type: 'broadcast', event: 'game_action', payload: { type: 'spin_result', resultIndex, cardText } });
  animateWheel(resultIndex, cardText, true);
};

function animateWheel(resultIndex, cardText, isMe) {
  if (!isMe) playSound('spin');
  currentRotation += (360 * 4) + (resultIndex * 180) + 90; 
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  setTimeout(() => {
    const resultTitle = ["حقیقت 💭", "جرات 🔥"][resultIndex];
    cardBox.innerText = `${resultTitle}\n\n${cardText}`;
    playSound('result');
    if (isMe && channel) channel.send({ type: 'broadcast', event: 'game_action', payload: { type: 'turn_change' } });
  }, 3100); 
}

function handleOpponentAction(payload) {
  if (payload.type === 'spin_result') { setTurn(false); animateWheel(payload.resultIndex, payload.cardText, false); } 
  else if (payload.type === 'turn_change') { setTurn(true); }
}
